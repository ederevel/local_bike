version: 2

models:
  - name: stg__local_bike_brands
    description: "This model contains information about the bikes brands"
    columns:
      - name: brand_id
        description: "Primary key, unique identifier for each brand."
        tests:
            - unique
            - not_null

  - name: stg__local_bike_categories
    description: "This model contains information about the bikes categories"
    columns:
      - name: category_id
        description: "Primary key, unique identifier for each category."
        tests:
            - unique
            - not_null

  - name: stg__local_bike_customers
    description: "This model contains information about the customers"
    columns:
      - name: customer_id
        description: "Primary key, unique identifier for each customer."
        tests:
            - unique
            - not_null

  - name: stg__local_bike_order_item
    description: "This model contains information about the order items"
    columns:
      - name: order_item_id
        description: "Primary key, unique identifier for each order item."
        tests:
            - unique
            - not_null
      - name: order_id
        description: "Foreign key, linking the order item to the corresponding order."
        tests:
          - relationships:
              name: order_id_foreign_key_in_stg_local_bike__order_item
              arguments:
                to: ref('stg__local_bike_orders')
                field: order_id
      - name: item_id
        description: "Within the same order identifier for the item like item 1, 2, 3..."
        tests:
            - not_null
      - name: product_id
        description: "Foreign key, linking the order item to the corresponding product."
        tests:
          - relationships:
              name: product_id_foreign_key_in_stg_local_bike__order_item
              arguments:
                to: ref('stg__local_bike_products')
                field: product_id

  - name: stg__local_bike_orders
    description: "This model contains information about the orders"
    columns:
      - name: order_id
        description: "Primary key, unique identifier for each order."
        tests:
            - unique
            - not_null
      - name: customer_id
        description: "Foreign key, linking the order to the corresponding customer."
        tests:
          - relationships:
              name: customer_id_foreign_key_in_stg_local_bike__orders
              arguments:
                to: ref('stg__local_bike_customers')
                field: customer_id
      - name: store_id
        description: "Foreign key, linking the order to the corresponding store."
        tests:
          - relationships:
              name: store_id_foreign_key_in_stg_local_bike__orders
              arguments:
                to: ref('stg__local_bike_stores')
                field: store_id
      - name: staff_id
        description: "Foreign key, linking the order item to the corresponding staff."
        tests:
          - relationships:
              name: staff_id_foreign_key_in_stg_local_bike__orders
              arguments:
                to: ref('stg__local_bike_staffs')
                field: staff_id

  - name: stg__local_bike_products
    description: "This model contains information about the products"
    columns:
      - name: product_id
        description: "Primary key, unique identifier for each product."
        tests:
            - unique
            - not_null
      - name: brand_id
        description: "Foreign key, linking the product to the corresponding brand."
        tests:
          - relationships:
              name: brand_id_foreign_key_in_stg_local_bike__products
              arguments:
                to: ref('stg__local_bike_brands')
                field: brand_id
      - name: category_id
        description: "Foreign key, linking the product to the corresponding category."
        tests:
          - relationships:
              name: category_id_foreign_key_in_stg_local_bike__products
              arguments:
                to: ref('stg__local_bike_categories')
                field: category_id

  - name: stg__local_bike_staffs
    description: "This model contains information about the staffs"
    columns:
      - name: staff_id
        description: "Primary key, unique identifier for each staff member."
        tests:
            - unique
            - not_null
      - name: store_id
        description: "Foreign key, linking the staff member to the corresponding store."
        tests:
          - relationships:
              name: store_id_foreign_key_in_stg_local_bike__staffs
              arguments:
                to: ref('stg__local_bike_stores')
                field: store_id
      - name: manager_id
        description: "Foreign key, linking the staff member to their manager. Null for the top-level manager."
        tests:
          - relationships:
              name: manager_id_foreign_key_in_stg_local_bike__staffs
              arguments:
                to: ref('stg__local_bike_staffs')
                field: staff_id
      - name: active
        description: "1 if active 0 if inactive"
        tests:
          - accepted_values:
              name: accepted_values_active
              arguments:
                values: [0, 1]
                quote: false

  - name: stg__local_bike_stocks
    description: "This model contains the stock quantity of each product in each store. The primary key is the combination of store_id and product_id."
    columns:
      - name: store_id
        description: "Part of the composite primary key, and foreign key linking the stock row to the corresponding store."
        tests:
          - not_null
          - relationships:
              name: store_id_foreign_key_in_stg_local_bike__stocks
              arguments:
                to: ref('stg__local_bike_stores')
                field: store_id
      - name: product_id
        description: "Part of the composite primary key, and foreign key linking the stock row to the corresponding product."
        tests:
          - not_null
          - relationships:
              name: product_id_foreign_key_in_stg_local_bike__stocks
              arguments:
                to: ref('stg__local_bike_products')
                field: product_id

  - name: stg__local_bike_stores
    description: "This model contains information about the stores"
    columns:
      - name: store_id
        description: "Primary key, unique identifier for each store."
        tests:
            - unique
            - not_null